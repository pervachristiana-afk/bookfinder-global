<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BookFinder Global — Find Any Book & Nearest Shop</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sora: ["Sora", "sans-serif"],
            inter: ["Inter", "sans-serif"]
          },
          colors: {
            brand: {
              orange: "#FF5A1F",
              lightOrange: "#FF8C42",
              dark: "#0F0F0F"
            }
          },
          boxShadow: {
            premium: "0 10px 30px rgba(0,0,0,.08)",
            premiumDark: "0 10px 35px rgba(0,0,0,.35)"
          }
        }
      }
    }
  </script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Supabase (shared database for community-added bookshops) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: "Inter", sans-serif; background: #FAFAF9; color: #111827; }
    .dark body { background: #0F0F0F; color: #fff; }
    h1,h2,h3,h4,h5,h6 { font-family: "Sora", sans-serif; }
    .gradient-text { background: linear-gradient(135deg,#FF5A1F,#FF8C42); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .orange-gradient { background: linear-gradient(135deg,#FF5A1F,#FF8C42); }
    .glass { backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { scrollbar-width: none; }
    .book-card { transition: transform .25s ease, box-shadow .25s ease; }
    .book-card:hover { transform: translateY(-5px) scale(1.015); box-shadow: 0 20px 45px rgba(0,0,0,.12); }
    .dark .book-card:hover { box-shadow: 0 20px 45px rgba(0,0,0,.4); }
    .fade-up { animation: fadeUp .55s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .shimmer { background: linear-gradient(90deg,#eeeeee 25%,#f8f8f8 50%,#eeeeee 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    .dark .shimmer { background: linear-gradient(90deg,#1a1a1a 25%,#262626 50%,#1a1a1a 75%); background-size: 200% 100%; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    #map { min-height: 500px; height: 100%; border-radius: 24px; }
    .leaflet-container { font-family: "Inter", sans-serif; }
    .modal-backdrop { background: rgba(0,0,0,.62); backdrop-filter: blur(8px); }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    @media (max-width: 768px) { #map { min-height: 380px; } }
  </style>
</head>

<body>

<div id="root"></div>

<!-- React -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<!-- Babel -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="text/babel">

const { useState, useEffect, useRef } = React;

/*
  ── SHARED DATABASE SETUP ──────────────────────────────────────────
  Paste your Supabase project URL and anon public key below.
  See README.md for the 2-minute setup steps (free, no credit card).
  If left blank, the app automatically falls back to saving bookshops
  only on each visitor's own device (localStorage), like before.
*/
const SUPABASE_URL = "https://uoqhnawnwskkdvxbbxft.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LbNhChHGuApTSd3WXgY8FQ_KoJf4NeX";

const supabase = (SUPABASE_URL && SUPABASE_ANON_KEY)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

const CATEGORIES = [
  "All","Business","Money & Finance","Marketing","Self-Help","Productivity",
  "Biography","Health","Psychology","History","Religion","Education",
  "Romance","Thriller","Fiction"
];

const PLACEHOLDER = "https://placehold.co/400x560/F3F4F6/111827?text=No+Cover";

function coverUrl(id) {
  return id ? `https://covers.openlibrary.org/b/id/${id}-L.jpg` : PLACEHOLDER;
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatDistance(km) {
  if (km < 1) return `${Math.round(km * 1000)}m away`;
  return `${km.toFixed(1)}km away`;
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function App() {
  const [dark, setDark] = useState(localStorage.getItem("bf-theme") === "dark");
  const [query, setQuery] = useState("");
  const [books, setBooks] = useState([]);
  const [loading, setLoading] = useState(false);
  const [selectedBook, setSelectedBook] = useState(null);
  const [category, setCategory] = useState("All");

  const [shops, setShops] = useState([]);
  const [location, setLocation] = useState(null);
  const [shopLoading, setShopLoading] = useState(false);
  const [shopError, setShopError] = useState("");

  const [showShopFinder, setShowShopFinder] = useState(false);
  const [showSellerForm, setShowSellerForm] = useState(false);

  const [sellerForm, setSellerForm] = useState({ name: "", area: "", phone: "", lat: "", lng: "" });
  const [sellerLocationLoading, setSellerLocationLoading] = useState(false);

  const mapRef = useRef(null);
  const leafletMapRef = useRef(null);
  const markerLayerRef = useRef(null);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", dark);
    localStorage.setItem("bf-theme", dark ? "dark" : "light");
  }, [dark]);

  useEffect(() => { loadFeaturedBooks(); }, []);

  async function loadFeaturedBooks() {
    setLoading(true);
    try {
      const response = await fetch("https://openlibrary.org/search.json?q=best+books&limit=20");
      const data = await response.json();
      setBooks(normalizeOpenLibrary(data.docs));
    } catch (error) {
      console.error(error);
    } finally {
      setLoading(false);
    }
  }

  function normalizeOpenLibrary(docs) {
    return docs.filter(book => book.title).map((book, index) => ({
      id: book.key || `book-${index}`,
      title: book.title,
      author: book.author_name?.[0] || "Unknown author",
      year: book.first_publish_year || "—",
      cover: book.cover_i || null,
      subjects: book.subject?.slice(0, 8) || [],
      publisher: book.publisher?.[0] || "Publisher unavailable",
      pages: book.number_of_pages_median || null,
      description: book.first_sentence?.[0] || "Description unavailable for this edition.",
      isbn: book.isbn?.[0] || null
    }));
  }

  async function searchBooks(term) {
    if (!term.trim()) { loadFeaturedBooks(); return; }
    setLoading(true);
    try {
      const url = `https://openlibrary.org/search.json?q=${encodeURIComponent(term)}&limit=40`;
      const response = await fetch(url);
      if (!response.ok) throw new Error("Search failed");
      const data = await response.json();
      let results = normalizeOpenLibrary(data.docs);

      // Backup API: only used if Open Library returns nothing usable.
      if (!results.length) {
        try {
          const backup = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(term)}&maxResults=40`);
          const backupData = await backup.json();
          results = (backupData.items || []).map(item => {
            const info = item.volumeInfo || {};
            return {
              id: item.id,
              title: info.title || "Untitled",
              author: info.authors?.[0] || "Unknown author",
              year: info.publishedDate?.slice(0,4) || "—",
              cover: null,
              externalCover: info.imageLinks?.thumbnail || null,
              subjects: info.categories || [],
              publisher: info.publisher || "Publisher unavailable",
              pages: info.pageCount || null,
              description: info.description || "Description unavailable.",
              preview: info.previewLink || null
            };
          });
        } catch (backupError) {
          console.warn("Backup API unavailable", backupError);
        }
      }
      setBooks(results);
    } catch (error) {
      console.error(error);
      setBooks([]);
    } finally {
      setLoading(false);
    }
  }

  async function handleSearch(event) {
    event.preventDefault();
    await searchBooks(query);
  }

  async function selectCategory(cat) {
    setCategory(cat);
    setQuery("");
    if (cat === "All") { loadFeaturedBooks(); return; }
    setLoading(true);
    try {
      const subject = cat.toLowerCase().replace(/&/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
      const response = await fetch(`https://openlibrary.org/subjects/${subject}.json?limit=40`);
      if (!response.ok) throw new Error("Category unavailable");
      const data = await response.json();
      const docs = (data.works || []).map(work => ({
        key: work.key,
        title: work.title,
        author_name: work.authors?.map(a => a.name),
        first_publish_year: work.first_publish_year,
        cover_i: work.cover_id,
        subject: work.subject
      }));
      setBooks(normalizeOpenLibrary(docs));
    } catch (error) {
      console.error(error);
      // Fall back to a plain search if this subject slug doesn't exist on Open Library.
      await searchBooks(cat);
    } finally {
      setLoading(false);
    }
  }

  function getLocation() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) { reject(new Error("Geolocation is not supported.")); return; }
      navigator.geolocation.getCurrentPosition(
        position => resolve({ lat: position.coords.latitude, lng: position.coords.longitude }),
        error => reject(error),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });
  }

  async function findNearbyShops() {
    setShopLoading(true);
    setShopError("");
    setShowShopFinder(true);
    try {
      const coords = await getLocation();
      setLocation(coords);

      const overpassQuery = `
        [out:json];
        (
          node[shop=books](around:10000,${coords.lat},${coords.lng});
          node[shop=stationery](around:10000,${coords.lat},${coords.lng});
          nwr[amenity=library](around:10000,${coords.lat},${coords.lng});
        );
        out 20;
      `;

      const response = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(overpassQuery)}`);
      if (!response.ok) throw new Error("Bookshop map service is temporarily unavailable.");
      const data = await response.json();

      const mappedShops = (data.elements || [])
        .filter(item => item.lat && item.lon)
        .map(item => {
          const tags = item.tags || {};
          const distance = haversine(coords.lat, coords.lng, item.lat, item.lon);
          const address = [tags["addr:housenumber"], tags["addr:street"], tags["addr:city"], tags["addr:postcode"]]
            .filter(Boolean).join(", ") || tags["addr:full"] || "Address not mapped";
          return {
            id: `osm-${item.id}`,
            name: tags.name || "Unnamed bookshop",
            lat: item.lat,
            lng: item.lon,
            distance,
            address,
            phone: tags.phone || tags["contact:phone"] || "",
            source: "OpenStreetMap"
          };
        });

      let community = [];
      if (supabase) {
        const { data, error } = await supabase.from("sellers").select("*");
        if (error) console.warn("Supabase fetch error", error);
        community = data || [];
      } else {
        community = JSON.parse(localStorage.getItem("bookfinder-sellers") || "[]");
      }
      const communityMapped = community
        .filter(seller => seller.lat && seller.lng)
        .map(seller => {
          const distance = haversine(coords.lat, coords.lng, Number(seller.lat), Number(seller.lng));
          return { ...seller, id: seller.id || `community-${Date.now()}`, lat: Number(seller.lat), lng: Number(seller.lng), distance, source: "Community Seller" };
        });

      const merged = [...mappedShops, ...communityMapped].sort((a,b) => a.distance - b.distance);
      setShops(merged);
      setTimeout(() => initializeMap(coords, merged), 100);
    } catch (error) {
      console.error(error);
      setShopError("We couldn't access your location, or the map service is busy. Please allow location access and try again.");
    } finally {
      setShopLoading(false);
    }
  }

  function initializeMap(coords, shopList) {
    if (!mapRef.current) return;
    if (!leafletMapRef.current) {
      leafletMapRef.current = L.map(mapRef.current);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(leafletMapRef.current);
    }
    const map = leafletMapRef.current;
    map.setView([coords.lat, coords.lng], 13);

    if (markerLayerRef.current) markerLayerRef.current.clearLayers();
    else markerLayerRef.current = L.layerGroup().addTo(map);

    L.marker([coords.lat, coords.lng]).bindPopup("<strong>You are here</strong>").addTo(markerLayerRef.current);

    shopList.forEach(shop => {
      L.marker([shop.lat, shop.lng])
        .bindPopup(`<strong>${escapeHtml(shop.name)}</strong><br>${escapeHtml(formatDistance(shop.distance))}`)
        .addTo(markerLayerRef.current);
    });
  }

  function useSellerLocation() {
    setSellerLocationLoading(true);
    getLocation()
      .then(coords => setSellerForm(previous => ({ ...previous, lat: coords.lat, lng: coords.lng })))
      .catch(() => alert("Please allow location access to use your current location."))
      .finally(() => setSellerLocationLoading(false));
  }

  async function saveSeller(event) {
    event.preventDefault();
    if (!sellerForm.name || !sellerForm.area || !sellerForm.phone || !sellerForm.lat || !sellerForm.lng) {
      alert("Please complete all fields.");
      return;
    }
    const seller = {
      name: sellerForm.name,
      area: sellerForm.area,
      address: sellerForm.area,
      phone: sellerForm.phone,
      lat: Number(sellerForm.lat),
      lng: Number(sellerForm.lng)
    };

    if (supabase) {
      const { error } = await supabase.from("sellers").insert([seller]);
      if (error) {
        console.error(error);
        alert("Couldn't save your bookshop to the shared database. Please try again.");
        return;
      }
      alert("Your bookshop has been added and is now visible to everyone.");
    } else {
      const existing = JSON.parse(localStorage.getItem("bookfinder-sellers") || "[]");
      localStorage.setItem("bookfinder-sellers", JSON.stringify([...existing, { ...seller, id: `seller-${Date.now()}` }]));
      alert("Your bookshop has been saved on this device. (Set up the shared database in README.md so everyone can see it.)");
    }

    setSellerForm({ name: "", area: "", phone: "", lat: "", lng: "" });
    setShowSellerForm(false);
    if (location) findNearbyShops();
  }

  return (
    <div className={dark ? "dark min-h-screen" : "min-h-screen"}>

      {/* HEADER */}
      <header className="sticky top-0 z-40 border-b border-black/5 dark:border-white/10 bg-[#FAFAF9]/90 dark:bg-[#0F0F0F]/90 glass">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center gap-4">
          <div className="shrink-0 flex items-center gap-1 cursor-pointer" onClick={() => { setCategory("All"); setQuery(""); loadFeaturedBooks(); }}>
            <span className="font-sora font-extrabold text-xl">BookFinder<span className="text-brand-orange">.</span></span>
          </div>
          <form onSubmit={handleSearch} className="flex-1 max-w-xl mx-auto">
            <div className="relative">
              <input
                value={query}
                onChange={e => setQuery(e.target.value)}
                placeholder="Search for any book, author..."
                className="w-full h-12 rounded-full pl-5 pr-14 text-sm outline-none border border-black/10 dark:border-white/10 bg-white dark:bg-[#1C1C1E] focus:ring-2 focus:ring-brand-orange/40"
              />
              <button type="submit" className="absolute right-1 top-1 h-10 w-10 rounded-full orange-gradient text-white flex items-center justify-center">🔍</button>
            </div>
          </form>
          <button onClick={findNearbyShops} title="Find nearby bookshops" className="shrink-0 h-11 w-11 rounded-full border border-black/10 dark:border-white/10 flex items-center justify-center text-lg">📍</button>
          <button onClick={() => setDark(!dark)} title="Toggle theme" className="shrink-0 h-11 w-11 rounded-full border border-black/10 dark:border-white/10 flex items-center justify-center text-lg">{dark ? "☀️" : "🌙"}</button>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        {!query && category === "All" && (
          <section className="pt-14 pb-8 fade-up text-center">
            <h1 className="text-4xl sm:text-5xl font-extrabold tracking-tight">Find Any Book, <span className="gradient-text">Anywhere</span></h1>
            <p className="mt-3 text-gray-500 dark:text-gray-400 max-w-lg mx-auto">Search millions of books & find the nearest shop to buy it in your city.</p>
          </section>
        )}

        <div className="flex gap-2 overflow-x-auto hide-scrollbar py-4">
          {CATEGORIES.map(cat => (
            <button key={cat} onClick={() => selectCategory(cat)}
              className={`whitespace-nowrap px-4 py-2 rounded-full text-sm font-semibold transition ${category === cat ? "bg-black text-white dark:bg-white dark:text-black" : "bg-gray-100 dark:bg-[#1C1C1E] text-gray-600 dark:text-gray-300"}`}>
              {cat}
            </button>
          ))}
        </div>

        {loading ? (
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-5 pb-14">
            {Array.from({ length: 10 }).map((_, i) => (
              <div key={i}>
                <div className="shimmer rounded-2xl" style={{ aspectRatio: "3/4" }}></div>
                <div className="shimmer h-3 w-3/4 mt-3 rounded"></div>
                <div className="shimmer h-3 w-1/2 mt-2 rounded"></div>
              </div>
            ))}
          </div>
        ) : books.length === 0 ? (
          <div className="text-center py-20 text-gray-400">No books found. Try another search.</div>
        ) : (
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-5 pb-14">
            {books.map(book => (
              <div key={book.id} className="book-card cursor-pointer fade-up" onClick={() => setSelectedBook(book)}>
                <img src={book.externalCover || coverUrl(book.cover)} alt={book.title}
                  onError={e => { e.target.onerror = null; e.target.src = PLACEHOLDER; }}
                  loading="lazy"
                  className="w-full rounded-2xl shadow-premium dark:shadow-premiumDark object-cover" style={{ aspectRatio: "3/4" }} />
                <div className="mt-2 font-sora font-semibold text-sm leading-tight line-clamp-2">{book.title}</div>
                <div className="text-xs text-gray-500 dark:text-gray-400 mt-0.5">{book.author}</div>
              </div>
            ))}
          </div>
        )}
      </main>

      {/* BOOK DETAIL MODAL */}
      {selectedBook && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop" onClick={e => { if (e.target === e.currentTarget) setSelectedBook(null); }}>
          <div className="bg-white dark:bg-[#1C1C1E] rounded-[24px] max-w-3xl w-full max-h-[85vh] overflow-y-auto p-6 sm:p-8 fade-up">
            <button onClick={() => setSelectedBook(null)} className="float-right text-xl">✕</button>
            <div className="flex flex-col sm:flex-row gap-6 clear-both pt-2">
              <img src={selectedBook.externalCover || coverUrl(selectedBook.cover)}
                onError={e => { e.target.onerror = null; e.target.src = PLACEHOLDER; }}
                className="w-40 sm:w-48 rounded-2xl shadow-premium mx-auto sm:mx-0" style={{ aspectRatio: "3/4", objectFit: "cover" }} />
              <div className="flex-1">
                <h2 className="font-sora font-bold text-2xl leading-tight">{selectedBook.title}</h2>
                <div className="text-gray-500 dark:text-gray-400 mt-1">{selectedBook.author}</div>
                <div className="text-xs text-gray-400 mt-2">{selectedBook.publisher} · {selectedBook.year}{selectedBook.pages ? ` · ${selectedBook.pages} pages` : ""}</div>
                {selectedBook.subjects?.length > 0 && (
                  <div className="flex flex-wrap gap-1.5 mt-3">
                    {selectedBook.subjects.slice(0, 6).map((s, i) => (
                      <span key={i} className="text-[11px] px-2 py-1 rounded-full bg-gray-100 dark:bg-white/10">{s}</span>
                    ))}
                  </div>
                )}
                <p className="text-sm mt-4 leading-relaxed text-gray-700 dark:text-gray-300">{selectedBook.description}</p>
                <div className="flex gap-2 mt-6">
                  <a href={selectedBook.preview || `https://www.google.com/search?q=${encodeURIComponent(selectedBook.title + " " + selectedBook.author + " book")}`}
                    target="_blank" rel="noopener" className="flex-1 text-center orange-gradient text-white font-semibold py-3 rounded-full text-sm">Read Preview</a>
                </div>
                <button onClick={() => { setSelectedBook(null); findNearbyShops(); }} className="w-full mt-2 border border-black/10 dark:border-white/20 font-semibold py-3 rounded-full text-sm">Find Nearest Shop To Buy This Book</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* SHOP FINDER MODAL */}
      {showShopFinder && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop" onClick={e => { if (e.target === e.currentTarget) setShowShopFinder(false); }}>
          <div className="bg-white dark:bg-[#1C1C1E] rounded-[24px] max-w-5xl w-full max-h-[90vh] overflow-hidden flex flex-col sm:flex-row fade-up">
            <div className="sm:w-2/5 p-5 overflow-y-auto max-h-[45vh] sm:max-h-[90vh]">
              <div className="flex items-center justify-between mb-4">
                <h3 className="font-sora font-bold text-lg">Nearby Bookshops</h3>
                <button onClick={() => setShowShopFinder(false)} className="text-xl">✕</button>
              </div>
              {shopLoading && <div className="text-sm text-gray-500">Finding bookshops near you...</div>}
              {shopError && <div className="text-sm text-red-500 mb-3">{shopError}</div>}
              {!shopLoading && shops.length === 0 && !shopError && (
                <div className="text-sm text-gray-500">No mapped bookshops found near you, but check Community Sellers below.</div>
              )}
              <div className="flex flex-col gap-3">
                {shops.map(shop => (
                  <div key={shop.id} className="p-4 rounded-2xl border border-black/5 dark:border-white/10">
                    <div className="flex justify-between items-start">
                      <div className="font-sora font-semibold text-sm">{shop.name}</div>
                      <span className="text-[11px] font-semibold px-2 py-1 rounded-full bg-orange-50 text-brand-orange dark:bg-white/10">{formatDistance(shop.distance)}</span>
                    </div>
                    <div className="text-xs text-gray-500 mt-1">{shop.address}</div>
                    <div className="text-[10px] text-gray-400 mt-1">{shop.source}</div>
                    <div className="flex gap-2 mt-3">
                      <a href={`https://www.openstreetmap.org/directions?from=${location ? location.lat + ',' + location.lng : ''}&to=${shop.lat},${shop.lng}`} target="_blank" rel="noopener" className="flex-1 text-center text-xs font-semibold py-2 rounded-full border border-black/10 dark:border-white/20">Directions</a>
                      {shop.phone && <a href={`https://wa.me/${String(shop.phone).replace(/[^0-9]/g, '')}`} target="_blank" rel="noopener" className="flex-1 text-center text-xs font-semibold py-2 rounded-full orange-gradient text-white">WhatsApp</a>}
                    </div>
                  </div>
                ))}
              </div>
              <button onClick={() => setShowSellerForm(true)} className="w-full mt-4 orange-gradient text-white font-semibold py-3 rounded-full text-sm">+ Add Your Bookshop</button>
            </div>
            <div className="sm:w-3/5 p-3">
              <div id="map" ref={mapRef}></div>
            </div>
          </div>
        </div>
      )}

      {/* ADD SELLER MODAL */}
      {showSellerForm && (
        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 modal-backdrop" onClick={e => { if (e.target === e.currentTarget) setShowSellerForm(false); }}>
          <form onSubmit={saveSeller} className="bg-white dark:bg-[#1C1C1E] rounded-[24px] max-w-sm w-full p-6 fade-up">
            <h3 className="font-sora font-bold text-lg mb-4">Add Your Bookshop</h3>
            <input value={sellerForm.name} onChange={e => setSellerForm({ ...sellerForm, name: e.target.value })} placeholder="Shop name" className="w-full mb-2 px-4 py-3 rounded-xl text-sm border border-black/10 dark:border-white/10 bg-transparent" />
            <input value={sellerForm.area} onChange={e => setSellerForm({ ...sellerForm, area: e.target.value })} placeholder="City / Area" className="w-full mb-2 px-4 py-3 rounded-xl text-sm border border-black/10 dark:border-white/10 bg-transparent" />
            <input value={sellerForm.phone} onChange={e => setSellerForm({ ...sellerForm, phone: e.target.value })} placeholder="WhatsApp number (with country code)" className="w-full mb-2 px-4 py-3 rounded-xl text-sm border border-black/10 dark:border-white/10 bg-transparent" />
            <div className="flex gap-2 mb-2">
              <input value={sellerForm.lat} onChange={e => setSellerForm({ ...sellerForm, lat: e.target.value })} placeholder="Latitude" className="w-1/2 px-4 py-3 rounded-xl text-sm border border-black/10 dark:border-white/10 bg-transparent" />
              <input value={sellerForm.lng} onChange={e => setSellerForm({ ...sellerForm, lng: e.target.value })} placeholder="Longitude" className="w-1/2 px-4 py-3 rounded-xl text-sm border border-black/10 dark:border-white/10 bg-transparent" />
            </div>
            <button type="button" onClick={useSellerLocation} className="text-xs underline text-brand-orange mb-4">{sellerLocationLoading ? "Getting location..." : "Use my current location"}</button>
            <div className="flex gap-2">
              <button type="button" onClick={() => setShowSellerForm(false)} className="flex-1 py-3 rounded-full text-sm font-semibold border border-black/10 dark:border-white/20">Cancel</button>
              <button type="submit" className="flex-1 py-3 rounded-full text-sm font-semibold orange-gradient text-white">Save</button>
            </div>
          </form>
        </div>
      )}

      <footer className="text-center text-xs text-gray-400 py-10">BookFinder Global — powered by Open Library, Google Books & OpenStreetMap.</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
